name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # Projects install this package straight from a Git tag, so dist/ is committed and must match src/.
      - name: dist/ is up to date
        run: git diff --exit-code -- dist || (echo "::error::Run pnpm build and commit dist/" && exit 1)
